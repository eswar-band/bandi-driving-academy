<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><style>@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(210px)}}@keyframes wipe{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(58deg)}}.f{animation:fall 1s linear infinite}.w{animation:wipe 2.2s ease-in-out infinite;transform-origin:160px 190px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="200" fill="#2b3548"/><rect x="20" y="14" width="280" height="172" rx="26" fill="#4d6585"/><g stroke="#cfe3fb" stroke-width="2" stroke-linecap="round" opacity=".75"><path class="f" d="M50 0v14"/><path class="f" d="M90 0v14" style="animation-delay:.3s"/><path class="f" d="M130 0v14" style="animation-delay:.65s"/><path class="f" d="M170 0v14" style="animation-delay:.15s"/><path class="f" d="M210 0v14" style="animation-delay:.8s"/><path class="f" d="M250 0v14" style="animation-delay:.45s"/><path class="f" d="M70 0v14" style="animation-delay:.9s"/><path class="f" d="M230 0v14" style="animation-delay:.1s"/></g><g class="w"><path d="M160 190V52" stroke="#10172b" stroke-width="5" stroke-linecap="round"/></g><circle cx="160" cy="190" r="8" fill="#10172b"/><text x="160" y="36" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">Wet road: slow down</text></svg>
